<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Database Initialization - CUTM Library</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>


<body style="
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    padding-top: 100px;
    background: #f5f6fa;
">

    <h2>CUTM Library Database Initialization</h2>

    <p>
        Click the button below to initialize the library books
        and system status in Firebase.
    </p>

    <button
        onclick="setupSystemMatrix()"
        style="
            padding: 15px 30px;
            font-weight: bold;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        "
    >
        Initialize Database
    </button>

    <p
        id="status-log"
        style="
            font-weight: bold;
            color: #2ecc71;
            margin-top: 20px;
            font-size: 18px;
        "
    ></p>


    <script>

        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================

        const firebaseConfig = {

            apiKey: "AIzaSyBY9y1SL9PTKveU7hg3QQYGTJXc0fjNoHU",

            authDomain: "cutm-library.firebaseapp.com",

            projectId: "cutm-library",

            storageBucket: "cutm-library.firebasestorage.app",

            messagingSenderId: "719135627027",

            appId: "1:719135627027:web:1b7c73157ea4675a816ce6",

            databaseURL:
                "https://cutm-library-default-rtdb.asia-southeast1.firebasedatabase.app"
        };


        // ==========================================
        // INITIALIZE FIREBASE
        // ==========================================

        firebase.initializeApp(firebaseConfig);

        const database = firebase.database();


        // ==========================================
        // INITIALIZE DATABASE
        // ==========================================

        function setupSystemMatrix() {

            const statusLog =
                document.getElementById("status-log");


            statusLog.style.color = "#0984e3";

            statusLog.innerText =
                "Initializing database...";


            // ==========================================
            // INITIAL BOOK CATALOG
            // ==========================================

            const initialCatalogData = {

                "b1": {
                    id: "b1",
                    name: "Python Programming Basics",
                    author: "John Doe",
                    rating: 4.8,
                    available: 5,
                    pic: "https://images.unsplash.com/photo-1526379095098-d400fd0bf935"
                },

                "b2": {
                    id: "b2",
                    name: "Database Management Systems",
                    author: "R. Elmasri",
                    rating: 4.5,
                    available: 3,
                    pic: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c"
                },

                "b3": {
                    id: "b3",
                    name: "Web Development with HTML/CSS",
                    author: "Jane Smith",
                    rating: 4.9,
                    available: 8,
                    pic: "https://images.unsplash.com/photo-1498050108023-c5249f4df085"
                },

                "b4": {
                    id: "b4",
                    name: "Advanced Java Architecture Fundamentals",
                    author: "James Gosling",
                    rating: 4.7,
                    available: 0,
                    pic: "https://images.unsplash.com/photo-1515879218367-8466d910aaa4"
                }

            };


            // ==========================================
            // WRITE BOOKS TO FIREBASE
            // ==========================================

            database.ref("library_books")
                .set(initialCatalogData)

                .then(function() {

                    // ==========================================
                    // WRITE SYSTEM STATUS
                    // ==========================================

                    return database.ref("system_status").set({

                        status: "Operational",

                        initialized:
                            new Date().toISOString()

                    });

                })

                .then(function() {

                    statusLog.style.color = "#2ecc71";

                    statusLog.innerText =
                        "Database initialized successfully!";

                    alert(
                        "Database Initialization Completed Successfully!"
                    );

                })

                .catch(function(error) {

                    console.error(
                        "Firebase Error:",
                        error
                    );

                    statusLog.style.color = "#e74c3c";

                    statusLog.innerText =
                        "Database Error: " +
                        error.message;

                    alert(
                        "Database initialization failed!\n\n" +
                        error.message
                    );

                });

        }

    </script>

</body>

</html>
