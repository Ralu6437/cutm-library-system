<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Faculty Account - CUTM Library</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.6),
                    rgba(0, 0, 0, 0.6)
                ),
                url('library-bg.png');

            background-color: #2d3436;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;

            min-height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .register-card {
            background-color: rgba(255, 255, 255, 0.95);

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 12px 36px rgba(0, 0, 0, 0.4);

            width: 100%;
            max-width: 380px;

            text-align: center;

            backdrop-filter: blur(8px);
        }

        .register-card img {
            height: 65px;
            width: auto;

            margin-bottom: 15px;
        }

        h2 {
            color: #2d3436;

            margin-top: 0;
            margin-bottom: 25px;

            font-size: 24px;
            font-weight: 600;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;

            font-size: 14px;
            color: #555;

            margin-bottom: 6px;

            font-weight: 500;
        }

        .input-group input {
            width: 100%;

            padding: 12px;

            border: 2px solid #ddd;
            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #0984e3;

            box-shadow:
                0 0 8px rgba(9, 132, 227, 0.2);
        }

        .register-btn {
            width: 100%;

            padding: 14px;

            background-color: #2ecc71;

            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: background 0.3s ease;

            margin-top: 10px;
        }

        .register-btn:hover {
            background-color: #27ae60;
        }

        .register-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .login-link {
            display: inline-block;

            margin-top: 20px;

            color: #74b9ff;

            text-decoration: none;

            font-size: 14px;

            transition: color 0.3s;
        }

        .login-link:hover {
            color: #0984e3;
        }

        #otpSection {
            margin-top: 10px;
        }

        #recaptcha-container {
            margin-top: 15px;
            margin-bottom: 5px;

            display: flex;
            justify-content: center;
        }

        .phone-note {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <!-- CUTM Logo -->
        <img src="logo.jpg" alt="CUTM Logo">

        <h2>Create Faculty Account</h2>


        <!-- ==========================================
             PHONE NUMBER
        =========================================== -->

        <div class="input-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter 10-digit number"
                maxlength="10"
                autocomplete="tel"
                inputmode="numeric"
            >

            <div class="phone-note">
                Enter your Indian 10-digit mobile number.
            </div>

        </div>


        <!-- ==========================================
             RECAPTCHA
        =========================================== -->

        <div id="recaptcha-container"></div>


        <!-- ==========================================
             SEND OTP BUTTON
        =========================================== -->

        <button
            type="button"
            id="sendOtpButton"
            onclick="sendOTP()"
            class="register-btn"
        >
            Send OTP
        </button>


        <!-- ==========================================
             OTP SECTION
        =========================================== -->

        <div
            class="input-group"
            id="otpSection"
            style="display: none;"
        >

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

        </div>


        <!-- ==========================================
             VERIFY BUTTON
        =========================================== -->

        <button
            type="button"
            id="verifyButton"
            onclick="verifyOTP()"
            class="register-btn"
            style="display: none;"
        >
            Verify & Register
        </button>


        <!-- ==========================================
             LOGIN LINK
        =========================================== -->

        <a
            href="faculty-login.html"
            class="login-link"
        >
            Already have an ID? Login here
        </a>

    </div>


    <script>

        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyBY9y1SL9PTKveU7hg3QQYGTJXc0fjNoHU",

            authDomain:
                "cutm-library.firebaseapp.com",

            projectId:
                "cutm-library",

            storageBucket:
                "cutm-library.firebasestorage.app",

            messagingSenderId:
                "719135627027",

            appId:
                "1:719135627027:web:1b7c73157ea4675a816ce6",

            databaseURL:
                "https://cutm-library-default-rtdb.asia-southeast1.firebasedatabase.app"

        };


        // ==========================================
        // INITIALIZE FIREBASE
        // ==========================================

        firebase.initializeApp(firebaseConfig);

        const database =
            firebase.database();

        const auth =
            firebase.auth();


        // ==========================================
        // OTP VARIABLE
        // ==========================================

        let confirmationResult = null;


        // ==========================================
        // CREATE RECAPTCHA
        // ==========================================

        let recaptchaVerifier =
            new firebase.auth.RecaptchaVerifier(
                "recaptcha-container",
                {
                    size: "normal",

                    callback: function(response) {

                        console.log(
                            "reCAPTCHA verified."
                        );

                    },

                    "expired-callback": function() {

                        alert(
                            "reCAPTCHA expired. " +
                            "Please complete it again."
                        );

                    }
                }
            );


        // ==========================================
        // SEND OTP
        // ==========================================

        function sendOTP() {

            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            const sendOtpButton =
                document.getElementById(
                    "sendOtpButton"
                );


            // ==========================================
            // CHECK PHONE
            // ==========================================

            if (!/^[0-9]{10}$/.test(phone)) {

                alert(
                    "Please enter a valid 10-digit phone number."
                );

                return;
            }


            // ==========================================
            // DISABLE BUTTON
            // ==========================================

            sendOtpButton.disabled = true;

            sendOtpButton.innerText =
                "Checking...";


            // ==========================================
            // CHECK EXISTING FACULTY
            // ==========================================

            database
                .ref("faculty/" + phone)
                .once("value")

                .then(function(snapshot) {


                    // ==========================================
                    // ACCOUNT ALREADY EXISTS
                    // ==========================================

                    if (snapshot.exists()) {

                        alert(
                            "This phone number is already registered.\n\n" +
                            "Please use Faculty Login."
                        );


                        sendOtpButton.disabled =
                            false;

                        sendOtpButton.innerText =
                            "Send OTP";


                        return null;
                    }


                    // ==========================================
                    // SEND OTP
                    // ==========================================

                    const phoneNumber =
                        "+91" + phone;


                    sendOtpButton.innerText =
                        "Sending OTP...";


                    return auth
                        .signInWithPhoneNumber(
                            phoneNumber,
                            recaptchaVerifier
                        );

                })

                .then(function(result) {

                    // No result means account already exists
                    if (!result) {
                        return;
                    }


                    // Save confirmation result
                    confirmationResult =
                        result;


                    alert(
                        "OTP sent successfully to +91 " +
                        phone
                    );


                    // ==========================================
                    // SHOW OTP FIELD
                    // ==========================================

                    document
                        .getElementById("otpSection")
                        .style.display = "block";


                    // ==========================================
                    // SHOW VERIFY BUTTON
                    // ==========================================

                    document
                        .getElementById("verifyButton")
                        .style.display = "block";


                    // ==========================================
                    // HIDE SEND BUTTON
                    // ==========================================

                    sendOtpButton.style.display =
                        "none";

                })

                .catch(function(error) {

                    console.error(
                        "OTP Error:",
                        error
                    );


                    let message =
                        error.message;


                    if (
                        error.code ===
                        "auth/invalid-phone-number"
                    ) {

                        message =
                            "The phone number is invalid.";

                    }

                    else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        message =
                            "Too many OTP requests. " +
                            "Please try again later.";

                    }

                    else if (
                        error.code ===
                        "auth/quota-exceeded"
                    ) {

                        message =
                            "Firebase SMS quota has been exceeded. " +
                            "Please try again later.";

                    }


                    alert(
                        "Unable to send OTP.\n\n" +
                        message
                    );


                    sendOtpButton.disabled =
                        false;

                    sendOtpButton.innerText =
                        "Send OTP";


                    // ==========================================
                    // RESET RECAPTCHA
                    // ==========================================

                    resetRecaptcha();

                });

        }


        // ==========================================
        // VERIFY OTP
        // ==========================================

        function verifyOTP() {

            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();


            const otp =
                document
                    .getElementById("otp")
                    .value
                    .trim();


            const verifyButton =
                document.getElementById(
                    "verifyButton"
                );


            // ==========================================
            // CHECK OTP
            // ==========================================

            if (!/^[0-9]{6}$/.test(otp)) {

                alert(
                    "Please enter the 6-digit OTP."
                );

                return;
            }


            // ==========================================
            // CHECK CONFIRMATION
            // ==========================================

            if (!confirmationResult) {

                alert(
                    "Please request an OTP first."
                );

                return;
            }


            // ==========================================
            // DISABLE BUTTON
            // ==========================================

            verifyButton.disabled =
                true;

            verifyButton.innerText =
                "Verifying...";


            // ==========================================
            // VERIFY OTP
            // ==========================================

            confirmationResult
                .confirm(otp)

                .then(function(result) {

                    const user =
                        result.user;


                    console.log(
                        "Firebase Auth UID:",
                        user.uid
                    );


                    // ==========================================
                    // SAVE FACULTY INFORMATION
                    // ==========================================

                    return database
                        .ref("faculty/" + phone)
                        .set({

                            phone:
                                phone,

                            uid:
                                user.uid,

                            authProvider:
                                "phone-otp",

                            createdAt:
                                new Date()
                                    .toISOString()

                        });

                })

                .then(function() {

                    alert(
                        "Faculty Account Created Successfully!"
                    );


                    // ==========================================
                    // GO TO LOGIN
                    // ==========================================

                    window.location.replace(
                        "faculty-login.html"
                    );

                })

                .catch(function(error) {

                    console.error(
                        "OTP Verification Error:",
                        error
                    );


                    let message =
                        error.message;


                    if (
                        error.code ===
                        "auth/invalid-verification-code"
                    ) {

                        message =
                            "The OTP is incorrect. " +
                            "Please check the SMS and try again.";

                    }

                    else if (
                        error.code ===
                        "auth/code-expired"
                    ) {

                        message =
                            "This OTP has expired. " +
                            "Please request a new OTP.";

                    }


                    alert(
                        "Registration failed.\n\n" +
                        message
                    );


                    verifyButton.disabled =
                        false;

                    verifyButton.innerText =
                        "Verify & Register";

                });

        }


        // ==========================================
        // RESET RECAPTCHA
        // ==========================================

        function resetRecaptcha() {

            try {

                recaptchaVerifier.clear();

            }

            catch (error) {

                console.log(
                    "reCAPTCHA clear error:",
                    error
                );

            }


            recaptchaVerifier =
                new firebase.auth.RecaptchaVerifier(
                    "recaptcha-container",
                    {
                        size: "normal",

                        callback: function(response) {

                            console.log(
                                "reCAPTCHA verified."
                            );

                        }
                    }
                );

        }

    </script>

</body>
</html>
