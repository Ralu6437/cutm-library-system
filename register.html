<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CUTM Library</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('library-bg.jpg') #2d3436 no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .register-card img {
            height: 65px;
            margin-bottom: 15px;
        }

        h2 {
            color: #2d3436;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #0984e3;
            outline: none;
            box-shadow: 0 0 8px rgba(9, 132, 227, 0.2);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background-color: #2ecc71; /* Green color accent for registration success paths */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .register-btn:hover {
            background-color: #27ae60;
        }

        .login-link {
            display: inline-block;
            margin-top: 20px;
            color: #74b9ff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .login-link:hover {
            color: #0984e3;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <img src="logo.jpg" alt="CUTM Logo">
        <h2>Create Student Account</h2>
        
        <!-- Sends registration data to our Python server backend -->
       <!-- Make sure it says 127.0.0.1:5000/register -->
<form action="http://127.0.0" method="POST">

            <div class="input-group">
                <label for="reg-no">Registration Number</label>
                <input type="text" id="reg-no" name="username" placeholder="e.g., 2203011200XX" required>
            </div>
            
            <div class="input-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a secure password" required>
            </div>
            
            <button type="submit" class="register-btn">Sign Up</button>
        </form>

        <a href="student-login.html" class="login-link">Already have an ID? Login here</a>
    </div>

</body>
</html>
